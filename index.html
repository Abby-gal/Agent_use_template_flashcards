<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flashcards</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<main class="page">
		<h1>Vocab Flashcards</h1>

		<form id="word-form">
			<label for="english-word">English word</label>
			<input type="text" id="english-word" required>

			<label for="german-word">German translation</label>
			<input type="text" id="german-word" required>

			<button type="submit">OK</button>
		</form>

		<section id="word-list-section">
			<h2>Saved words</h2>
			<ul id="word-list"></ul>
		</section>

		<section id="flashcard-section">
			<h2>Practise</h2>
			<button id="flashcard" type="button">Add a word pair to start</button>
			<button id="next-card" type="button">Next</button>
		</section>
	</main>
</body>
</html>
